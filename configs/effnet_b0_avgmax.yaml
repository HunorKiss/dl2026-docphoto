# Experiment step: the head sees the mean AND the maximum of the backbone's
# feature map (model.pool: avgmax), instead of the mean alone. A defect in one
# region of the page (a smear across one column, a crease) is averaged away over
# the 24 x 24 positions; the maximum keeps it. SmallCNN pools the same way.
# The ONLY change from configs/effnet_b0_ens_lr1e-4.yaml is model.pool, so the
# two are directly comparable (same folds, same epochs, same learning rates).
#
#   for k in 0 1 2 3:  python -m src.train --fold k --tta --config configs/effnet_b0_avgmax.yaml --out models/effnet_b0_avgmax
#   python -m src.predict --ensemble --config configs/effnet_b0_avgmax.yaml --models models/effnet_b0_avgmax --tta
#
# Everything is named after this file: the W&B runs (effnet_b0_avgmax_fold0_seed42, ...),
# the checkpoints in models/effnet_b0_avgmax/ and the submission
# submissions/effnet_b0_avgmax_tta.csv.
seed: 42

data:
  raw: data/raw
  work: data/work/reference      # the 1024 px resize cache of src.prepare
  cache_size: 1024
  image_size: 768

split:
  column: group_strict
  n_folds: 4

model:
  type: effnet_b0
  pool: avgmax                   # avg (torchvision's head) | avgmax (mean and max side by side)
  dropout: 0.2
  pretrained: true

train:
  epochs: 12
  phases: [head, all]
  phase_epochs: [6, 6]
  batch_size: 8
  lr: 1.0e-4                     # the head phase
  finetune_lr: 1.0e-4            # the whole-network phase: the same lr, as in the 0.148 run
  weight_decay: 0.05
  warmup: 0.2
  max_shift: 16
  amp: true
  num_workers: 0

wandb:
  project: snap-or-retake
