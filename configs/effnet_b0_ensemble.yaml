# The EfficientNet-B0 recipe of the first Kaggle run (public 0.148), for training
# the four folds whose average is then predicted with `src.predict --ensemble`:
# head only for 6 epochs, then the whole network for 6, ONE learning rate for
# both phases, dropout 0.2.
# NOTE: configs/effnet_b0.yaml no longer is that recipe: it has finetune_lr 1e-5
# (10x smaller) for the whole-network phase. The dropout and 4+8 experiments
# inherited the 1e-5, so they changed two things at once. Here finetune_lr is
# 1e-4 again; set it back to 1e-5 to use the other recipe.
#
#   for k in 0 1 2 3:  python -m src.train --fold k --config configs/effnet_b0_ensemble.yaml --out models/effnet_b0_ensemble
#   python -m src.predict --ensemble --config configs/effnet_b0_ensemble.yaml --models models/effnet_b0_ensemble --tta
#
# Everything is named after this file: the W&B runs (effnet_b0_ensemble_fold0_seed42, ...),
# the checkpoints in models/effnet_b0_ensemble/ and the submission
# submissions/effnet_b0_ensemble_tta.csv.
seed: 42

data:
  raw: data/raw
  work: data/work/reference      # the 1024 px resize cache of src.prepare
  cache_size: 1024
  image_size: 768

split:
  column: group_strict
  n_folds: 4

model:
  type: effnet_b0
  dropout: 0.2
  pretrained: true

train:
  epochs: 12
  phases: [head, all]
  phase_epochs: [6, 6]
  batch_size: 8
  lr: 1.0e-4                     # the head phase
  finetune_lr: 1.0e-5            # the whole-network phase (the first run used the same lr for both)
  weight_decay: 0.05
  warmup: 0.2
  max_shift: 16
  amp: true
  num_workers: 0

wandb:
  project: snap-or-retake
